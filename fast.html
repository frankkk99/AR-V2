<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#101C16">
<title>ป่าดงพงไพร · AR</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js">
<style>
:root{--ink:#0b1611;--panel:#17281e;--paper:#f3ecdd;--gold:#d8b86a;--moss:#385a42;--bloom:#e76786;--edge:rgba(216,184,106,.3)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--ink);color:var(--paper);font-family:Tahoma,system-ui,sans-serif}
button{font:inherit;touch-action:manipulation}
#feed,canvas.gl{position:fixed;inset:0;width:100%;height:100%}
#feed{display:none;object-fit:cover;background:#000}
canvas.gl{display:block}
#stage{position:fixed;width:2px;height:2px;opacity:.01;overflow:hidden;pointer-events:none}
#intro{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 22px) 18px calc(env(safe-area-inset-bottom) + 20px);overflow:auto;background:radial-gradient(circle at 80% 10%,rgba(80,125,88,.45),transparent 35%),linear-gradient(150deg,#1b3526,#09120e)}
.brand{font-size:11px;line-height:1.45;color:#b9ccae}.eyebrow{margin-top:18px;color:var(--gold);font:10px ui-monospace,monospace;letter-spacing:.18em}.title{font-size:clamp(34px,10vw,52px);line-height:1.12;margin-top:7px}.subtitle{color:#cdd8c8;font-size:14px;line-height:1.65;margin-top:8px}
#cards{display:grid;gap:10px;margin-top:auto;padding-top:20px}.card{position:relative;width:100%;min-height:108px;display:grid;grid-template-columns:92px 1fr;align-items:center;gap:15px;padding:12px;border:1px solid var(--edge);border-radius:20px;background:rgba(32,57,41,.82);color:var(--paper);text-align:left}.card img{width:92px;height:84px;object-fit:contain}.card strong{display:block;font-size:21px}.card em{display:block;margin-top:3px;color:#b9ccae;font-size:12px}.card::after{content:'แตะเพื่อเริ่ม AR';display:block;margin-top:12px;color:#132018;background:var(--gold);padding:10px 15px;border-radius:999px;text-align:center;font-weight:700}.direct .title{font-size:clamp(32px,9vw,48px)}.direct .subtitle{display:none}.direct #cards{flex:1;display:flex;min-height:0}.direct .card{display:flex;flex:1;flex-direction:column;justify-content:center;text-align:center;border-width:2px;border-radius:28px}.direct .card img{width:min(72vw,340px);height:min(48vh,400px)}
#ar{position:fixed;inset:0;z-index:30;display:none;pointer-events:none}#ar.on{display:block}.top{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:9px;padding:calc(env(safe-area-inset-top) + 12px) 14px 24px;background:linear-gradient(rgba(7,17,11,.78),transparent);pointer-events:auto}.dot{width:8px;height:8px;border-radius:50%;background:var(--bloom)}.dot.ready{background:#b9ccae}.name{font-size:12px}.exit{margin-left:auto;border:1px solid var(--edge);border-radius:999px;padding:10px 15px;background:rgba(18,34,25,.8);color:var(--paper)}
.hint{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 110px);max-width:90vw;transform:translateX(-50%);padding:10px 16px;border:1px solid var(--edge);border-radius:999px;background:rgba(18,34,25,.82);font-size:13px;text-align:center;white-space:nowrap}.dock{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:8px;padding:16px 12px calc(env(safe-area-inset-bottom) + 18px);background:linear-gradient(transparent,rgba(7,17,11,.85));pointer-events:auto}.btn{min-height:48px;padding:11px 18px;border:1px solid var(--edge);border-radius:999px;background:rgba(18,34,25,.84);color:var(--paper)}.btn.hero{background:var(--gold);color:#132018;font-weight:700}.btn:disabled{opacity:.42}
#msg{position:fixed;inset:0;z-index:70;display:none;place-items:center;padding:28px;background:rgba(8,18,12,.97);text-align:center}#msg.on{display:grid}#msg h2{margin-bottom:10px}#msg p{color:#cdd8c8;line-height:1.65;margin-bottom:18px}
#hud{position:fixed;left:6px;bottom:6px;z-index:80;display:none;padding:6px;background:rgba(0,0,0,.7);color:#7bd88f;font:10px/1.4 ui-monospace,monospace;white-space:pre}#hud.on{display:block}
</style>
</head>
<body>
<video id="feed" playsinline muted autoplay></video>
<div id="stage"></div><div id="hud"></div>
<section id="intro">
  <div class="brand">พิพิธภัณฑ์การเกษตรเฉลิมพระเกียรติฯ · ปทุมธานี</div>
  <div class="eyebrow">AR NATURE EXPERIENCE</div>
  <h1 class="title">ป่าดงพงไพร</h1>
  <p class="subtitle">เลือกสิ่งมีชีวิต แล้วเปิดกล้องเพื่อวางลงบนพื้นตรงหน้า</p>
  <div id="cards"></div>
</section>
<div id="ar">
  <div class="top"><span id="dot" class="dot"></span><span id="name" class="name">กำลังเตรียม</span><button id="exit" class="exit">ออก</button></div>
  <div id="hint" class="hint">กำลังเปิดกล้อง…</div>
  <div class="dock"><button id="place" class="btn hero" disabled>วางตรงนี้</button><button id="replay" class="btn" hidden>เล่นอีกครั้ง</button><button id="move" class="btn" hidden>ย้ายที่</button></div>
</div>
<div id="msg"><div><h2 id="msgTitle"></h2><p id="msgText"></p><button class="btn hero" onclick="location.reload()">ลองใหม่</button></div></div>
<script type="module">
const THREE_URL='https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const threePromise=import(THREE_URL).then(mod=>{mod.ColorManagement.enabled=false;return mod});
const SPECIMENS=[
 {id:'tulip',th:'ดอกกระเจียวแดง',sci:'Curcuma alismatifolia',file:'tulip.mp4',width:1.50,baseY:.45},
 {id:'butterfly',th:'ผีเสื้อ',sci:'Lepidoptera',file:'butterfly.mp4',width:2.40,baseY:1.30},
 {id:'mushroom',th:'เห็ดป่าเต็งรัง',sci:'Fungi spp.',file:'mushroom.mp4',width:1.15,baseY:.32}
];
const THUMBS={tulip:'/thumbs/tulip.webp',butterfly:'/thumbs/butterfly.webp',mushroom:'/thumbs/mushroom.webp'};
const POINTS={'1':'tulip','2':'butterfly','3':'mushroom'};
const pathPoint=location.pathname.match(/^\/p([123])\/?$/)?.[1];
const qp=new URLSearchParams(location.search);const directId=POINTS[pathPoint||qp.get('p')]||qp.get('s');
const DIRECT=SPECIMENS.find(x=>x.id===directId)||null;
const $=s=>document.querySelector(s),intro=$('#intro'),ar=$('#ar'),feed=$('#feed'),hint=$('#hint'),dot=$('#dot'),place=$('#place'),replay=$('#replay'),move=$('#move');
if(DIRECT)intro.classList.add('direct');
$('#cards').innerHTML=(DIRECT?[DIRECT]:SPECIMENS).map(s=>`<button class="card" data-id="${s.id}"><img src="${THUMBS[s.id]}" alt="${s.th}" width="340" height="400" decoding="async" ${DIRECT?'fetchpriority="high"':'loading="lazy"'}><span><strong>${s.th}</strong><em>${s.sci}</em></span></button>`).join('');
let THREE,renderer,scene,cam,reticle,group,video,texture,plane,xrSession,xrHitSource,stream;
let launching=false,moving=true,placed=false,assetReady=false,trackingReady=false,mode='boot',scale=1,pinch0=0,scale0=1;
let q={alpha:0,beta:0,gamma:0,orient:0,live:false};let zee,euler,q0,q1,ray,ground,hit;
const VERT=`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`;
const FRAG=`varying vec2 vUv;uniform sampler2D map;void main(){vec3 c=texture2D(map,vec2(vUv.x,vUv.y*.5+.5)).rgb;float a=texture2D(map,vec2(vUv.x,vUv.y*.5)).r;if(a<.012)discard;gl_FragColor=vec4(c,a);}`;
function fail(t,p){$('#msgTitle').textContent=t;$('#msgText').textContent=p;$('#msg').classList.add('on')}
function requestOrientation(){return(typeof DeviceOrientationEvent!=='undefined'&&DeviceOrientationEvent.requestPermission)?DeviceOrientationEvent.requestPermission().catch(()=> 'denied'):Promise.resolve('granted')}
function requestFallbackCamera(){return navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false}).then(async s=>{stream=s;feed.srcObject=s;feed.style.display='block';await feed.play().catch(()=>{});hint.textContent='กล้องพร้อมแล้ว · กำลังเตรียม AR';return s})}
function requestXR(){if(!navigator.xr)return Promise.resolve(null);try{return navigator.xr.requestSession('immersive-ar',{requiredFeatures:['hit-test'],optionalFeatures:['dom-overlay'],domOverlay:{root:ar}}).catch(()=>null)}catch{return Promise.resolve(null)}}
function makeVideo(spec){const v=document.createElement('video');v.src='/'+spec.file;v.loop=true;v.muted=true;v.playsInline=true;v.preload='auto';v.setAttribute('playsinline','');v.setAttribute('webkit-playsinline','');$('#stage').appendChild(v);return v}
function videoReady(v,ms=9000){return new Promise(resolve=>{if(v.readyState>=2&&v.videoWidth)return resolve(true);const t=setTimeout(()=>resolve(false),ms);const ok=()=>{clearTimeout(t);resolve(true)};v.addEventListener('loadeddata',ok,{once:true});v.addEventListener('error',()=>{clearTimeout(t);resolve(false)},{once:true})})}
function buildScene(spec){scene=new THREE.Scene();cam=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.01,100);cam.position.set(0,1.45,0);renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.outputColorSpace=THREE.LinearSRGBColorSpace;renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.domElement.className='gl';document.body.appendChild(renderer.domElement);
 reticle=new THREE.Mesh(new THREE.RingGeometry(.08,.105,36),new THREE.MeshBasicMaterial({color:0xd8b86a,transparent:true,opacity:.95,side:THREE.DoubleSide}));reticle.rotation.x=-Math.PI/2;reticle.visible=false;scene.add(reticle);group=new THREE.Group();group.visible=false;scene.add(group);
 texture=new THREE.VideoTexture(video);texture.colorSpace=THREE.NoColorSpace;texture.minFilter=THREE.LinearFilter;texture.magFilter=THREE.LinearFilter;plane=new THREE.Mesh(new THREE.PlaneGeometry(spec.width,spec.width*9/16),new THREE.ShaderMaterial({vertexShader:VERT,fragmentShader:FRAG,uniforms:{map:{value:texture}},transparent:true,premultipliedAlpha:true,depthWrite:false,side:THREE.DoubleSide}));plane.position.y=spec.baseY;group.add(plane);
 zee=new THREE.Vector3(0,0,1);euler=new THREE.Euler();q0=new THREE.Quaternion();q1=new THREE.Quaternion(-Math.SQRT1_2,0,0,Math.SQRT1_2);ray=new THREE.Raycaster();ground=new THREE.Plane(new THREE.Vector3(0,1,0),0);hit=new THREE.Vector3();addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})}
async function startXR(session){mode='xr';xrSession=session;renderer.xr.enabled=true;renderer.xr.setReferenceSpaceType('local');await renderer.xr.setSession(session);const viewer=await session.requestReferenceSpace('viewer');xrHitSource=await session.requestHitTestSource({space:viewer});session.addEventListener('end',()=>location.reload());renderer.setAnimationLoop(renderXR);hint.textContent='เล็งกล้องไปที่พื้นเพื่อหาจุดวาง'}
async function startFallback(orientationPromise,cameraPromise){mode='fallback';await(cameraPromise||requestFallbackCamera());q.live=(await orientationPromise)==='granted';if(q.live)addEventListener('deviceorientation',e=>{if(e.alpha==null)return;q.alpha=THREE.MathUtils.degToRad(e.alpha);q.beta=THREE.MathUtils.degToRad(e.beta);q.gamma=THREE.MathUtils.degToRad(e.gamma);q.orient=THREE.MathUtils.degToRad(screen.orientation?.angle||window.orientation||0)},true);else cam.rotation.set(-.42,0,0);renderer.setAnimationLoop(renderFallback);hint.textContent=q.live?'เล็งกล้องไปที่พื้น':'เปิดกล้องแล้ว · เครื่องไม่อนุญาตเซ็นเซอร์การหมุน'}
function orientCamera(){if(!q.live)return;euler.set(q.beta,q.alpha,-q.gamma,'YXZ');cam.quaternion.setFromEuler(euler).multiply(q1).multiply(q0.setFromAxisAngle(zee,-q.orient))}
function billboard(activeCam){if(!group.visible)return;const p=new THREE.Vector3();activeCam.getWorldPosition(p);group.rotation.y=Math.atan2(p.x-group.position.x,p.z-group.position.z)}
function updateReady(v){trackingReady=!!v;dot.classList.toggle('ready',trackingReady&&assetReady);place.disabled=!(trackingReady&&assetReady);if(trackingReady&&!assetReady)hint.textContent='พบพื้นแล้ว · กำลังเตรียมวิดีโอ';else if(trackingReady)hint.textContent='พร้อมแล้ว · แตะ “วางตรงนี้”'}
function renderXR(_,frame){if(frame&&moving&&xrHitSource){const ref=renderer.xr.getReferenceSpace(),hits=frame.getHitTestResults(xrHitSource);if(hits.length){const pose=hits[0].getPose(ref);reticle.visible=true;reticle.position.setFromMatrixPosition(new THREE.Matrix4().fromArray(pose.transform.matrix));updateReady(true)}else{reticle.visible=false;updateReady(false)}}billboard(renderer.xr.getCamera());renderer.render(scene,cam)}
function renderFallback(){orientCamera();cam.updateMatrixWorld(true);if(moving){ray.setFromCamera(new THREE.Vector2(0,0),cam);const ok=ray.ray.intersectPlane(ground,hit)&&hit.distanceTo(cam.position)<8;reticle.visible=!!ok;if(ok)reticle.position.copy(hit);updateReady(!!ok)}billboard(cam);renderer.render(scene,cam)}
function launch(spec){if(launching)return;launching=true;$('#name').textContent=spec.th;intro.style.display='none';ar.classList.add('on');hint.textContent='กำลังเปิดกล้อง…';const orientationPromise=requestOrientation();const sessionPromise=requestXR();const cameraPromise=navigator.xr?null:requestFallbackCamera();video=makeVideo(spec);const playPromise=video.play().catch(()=>null);
 boot(spec,orientationPromise,sessionPromise,cameraPromise,playPromise)}
async function boot(spec,orientationPromise,sessionPromise,cameraPromise,playPromise){try{if(!navigator.mediaDevices?.getUserMedia)throw new Error('เบราว์เซอร์นี้ไม่รองรับกล้อง');THREE=await threePromise;buildScene(spec);const session=await sessionPromise;if(session)await startXR(session);else await startFallback(orientationPromise,cameraPromise);Promise.all([playPromise,videoReady(video)]).then(([,ok])=>{if(!ok)return fail('โหลดวิดีโอไม่สำเร็จ','กรุณารีเฟรชแล้วลองใหม่');assetReady=true;updateReady(trackingReady)}).catch(()=>fail('เล่นวิดีโอไม่ได้','กรุณาปิดโหมดประหยัดพลังงานแล้วลองใหม่'))}catch(e){console.error(e);fail('เปิด AR ไม่ได้',e.message||'กรุณาตรวจสอบสิทธิ์กล้องและอินเทอร์เน็ต')}}
place.addEventListener('click',()=>{if(!reticle.visible||!assetReady)return;group.position.copy(reticle.position);group.visible=true;reticle.visible=false;moving=false;placed=true;group.scale.setScalar(scale);video.currentTime=0;video.play().catch(()=>{});place.hidden=true;replay.hidden=false;move.hidden=false;hint.textContent='วางแล้ว · เดินรอบดูได้'});
replay.addEventListener('click',()=>{video.currentTime=0;video.play().catch(()=>{});});move.addEventListener('click',()=>{moving=true;placed=false;group.visible=false;place.hidden=false;place.disabled=true;replay.hidden=true;move.hidden=true;updateReady(false)});$('#exit').addEventListener('click',()=>location.reload());
addEventListener('touchstart',e=>{if(e.touches.length===2&&placed){pinch0=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);scale0=scale}},{passive:true});addEventListener('touchmove',e=>{if(e.touches.length===2&&placed&&pinch0){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);scale=THREE.MathUtils.clamp(scale0*d/pinch0,.35,3.5);group.scale.setScalar(scale)}},{passive:true});addEventListener('touchend',()=>pinch0=0,{passive:true});
document.querySelectorAll('.card').forEach(c=>c.addEventListener('click',()=>launch(SPECIMENS.find(s=>s.id===c.dataset.id))));
</script>
</body>
</html>
